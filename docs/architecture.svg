<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Homelab — Architecture</title>
  <desc id="desc">Nouvelle illustration de l'architecture du homelab : famille et administrateur, Proxmox VE, VM Ubuntu Docker, Caddy, oauth2-proxy, Keycloak, services publics et d'administration, GPU NVIDIA Quadro P1000 et sauvegardes.</desc>
  <defs>
    <style>
      .frame{fill:#0E1015;stroke:#23272F}
      .host{fill:#101319;stroke:#39414F}
      .vm{fill:#0F141B;stroke:#39414F;stroke-dasharray:5 5}
      .card{fill:#171A21;stroke:#2A2F3A}
      .card-soft{fill:#13161D;stroke:#262B34}
      .card-violet{fill:#171A21;stroke:#A78BFA;stroke-opacity:.72}
      .card-green{fill:#171A21;stroke:#76B900;stroke-opacity:.8}
      .chip{fill:#1A1E26}
      .title{fill:#E8C87A;font-size:15px;font-weight:600;letter-spacing:3px}
      .subtitle{fill:#8B94A3;font-size:12px}
      .section{fill:#9AA2AF;font-size:11px;font-weight:600;letter-spacing:1.35px}
      .h1{fill:#E9ECF1;font-size:15px;font-weight:600}
      .h2{fill:#E9ECF1;font-size:13px;font-weight:600}
      .body{fill:#9AA2AF;font-size:11px}
      .small{fill:#7B8696;font-size:10px}
      .line{fill:none;stroke:#5A6678;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
      .auth{fill:none;stroke:#B9A6FB;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
      .gpu{fill:none;stroke:#76B900;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
      .icon{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto">
      <path d="M0 0L7 3 0 6Z" fill="#5A6678"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto">
      <path d="M0 0L7 3 0 6Z" fill="#B9A6FB"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto">
      <path d="M0 0L7 3 0 6Z" fill="#76B900"/>
    </marker>
  </defs>

  <rect x=".5" y=".5" width="999" height="759" rx="18" class="frame"/>
  <text x="500" y="35" text-anchor="middle" class="title">Homelab — ARCHITECTURE</text>
  <text x="500" y="56" text-anchor="middle" class="subtitle">Une porte d'entrée · un compte · une VM Docker sur Proxmox</text>

  <!-- Utilisateurs -->
  <g transform="translate(210 74)">
    <rect width="245" height="54" rx="10" class="card"/>
    <rect x="14" y="10" width="34" height="34" rx="9" fill="#E8C87A" fill-opacity=".13"/>
    <g class="icon" stroke="#E8C87A">
      <circle cx="31" cy="22" r="4"/>
      <circle cx="23" cy="25" r="3"/>
      <circle cx="39" cy="25" r="3"/>
      <path d="M25 37c0-5 2-8 6-8s6 3 6 8M18 39c0-4 2-7 5-7m21 7c0-4-2-7-5-7"/>
    </g>
    <text x="61" y="23" class="h1">Famille</text>
    <text x="61" y="40" class="body">navigateur · TV · mobile</text>
  </g>
  <g transform="translate(545 74)">
    <rect width="245" height="54" rx="10" class="card"/>
    <rect x="14" y="10" width="34" height="34" rx="9" fill="#E8C87A" fill-opacity=".13"/>
    <g class="icon" stroke="#E8C87A">
      <circle cx="28" cy="22" r="4.5"/>
      <path d="M20 38c0-6 3-9 8-9s8 3 8 9m4-16 6 6m-8 8 9-9"/>
    </g>
    <text x="61" y="23" class="h1">Admin</text>
    <text x="61" y="40" class="body">gestion de l'infrastructure</text>
  </g>
  <path d="M332 128v17h168m168-17v17H500v20" class="line" marker-end="url(#arrow)"/>
  <rect x="459" y="136" width="82" height="20" rx="5" class="card"/>
  <text x="500" y="150" text-anchor="middle" class="small">HTTPS 443</text>

  <!-- Hyperviseur -->
  <rect x="35" y="166" width="930" height="475" rx="16" class="host"/>
  <rect x="51" y="177" width="250" height="23" rx="6" class="chip"/>
  <g transform="translate(61 181)">
    <path fill="#E8821E" d="M2 1h5l5 6 5-6h5l-8 9 8 9h-5l-5-6-5 6H2l8-9z"/>
  </g>
  <text x="88" y="193" class="section">PROXMOX VE · HYPERVISEUR</text>

  <!-- VM -->
  <rect x="55" y="211" width="755" height="410" rx="13" class="vm"/>
  <rect x="72" y="221" width="268" height="23" rx="6" class="chip"/>
  <g transform="translate(82 225)">
    <circle cx="8" cy="8" r="7" fill="none" stroke="#E95420" stroke-width="2"/>
    <circle cx="8" cy="1.8" r="2.6" fill="#E95420"/>
    <circle cx="2.7" cy="11" r="2.6" fill="#E95420"/>
    <circle cx="13.3" cy="11" r="2.6" fill="#E95420"/>
    <g transform="translate(22)">
      <rect x="0" y="5" width="6" height="6" fill="#2496ED"/>
      <rect x="7" y="5" width="6" height="6" fill="#2496ED"/>
      <rect x="14" y="5" width="6" height="6" fill="#2496ED"/>
      <rect x="7" y="-2" width="6" height="6" fill="#2496ED"/>
      <path d="M-2 12h25c-1 5-5 7-12 7S0 17-2 12z" fill="#2496ED"/>
    </g>
  </g>
  <text x="130" y="237" class="section">VM UBUNTU 24.04 · DOCKER</text>

  <!-- Façade -->
  <g transform="translate(86 258)">
    <rect width="292" height="70" rx="12" class="card"/>
    <rect x="16" y="18" width="34" height="34" rx="9" fill="#3FA9DC" fill-opacity=".15"/>
    <g class="icon" stroke="#3FA9DC">
      <rect x="23" y="25" width="20" height="6" rx="1"/>
      <rect x="23" y="34" width="20" height="6" rx="1"/>
      <path d="M28 47h10m-5-7v7"/>
    </g>
    <text x="62" y="31" class="h1">Caddy</text>
    <text x="62" y="50" class="body">reverse proxy · TLS · point d'entrée</text>
  </g>

  <g transform="translate(401 258)">
    <rect width="174" height="70" rx="12" class="card-violet"/>
    <rect x="14" y="18" width="34" height="34" rx="9" fill="#A78BFA" fill-opacity=".15"/>
    <g class="icon" stroke="#A78BFA">
      <path d="M31 24l10 5v8c0 7-6 11-10 13-4-2-10-6-10-13v-8z"/>
      <circle cx="31" cy="34" r="3"/>
      <path d="M26 42c1-4 3-5 5-5s4 1 5 5"/>
    </g>
    <text x="59" y="31" class="h2">oauth2-proxy</text>
    <text x="59" y="49" class="body">portier forward_auth</text>
  </g>

  <g transform="translate(598 258)">
    <rect width="190" height="70" rx="12" class="card-violet"/>
    <rect x="14" y="18" width="34" height="34" rx="9" fill="#A78BFA" fill-opacity=".15"/>
    <g transform="translate(20 24)">
      <path fill="#A78BFA" d="M18 0H6L0 12l6 12h12l6-12zm-2 5 4 7-4 7h-3l4-7-4-7zM8 5h3l-4 7 4 7H8l-4-7z"/>
    </g>
    <text x="59" y="28" class="h2">Keycloak</text>
    <text x="59" y="45" class="body">SSO · OIDC</text>
    <text x="59" y="59" class="small">rôles media / infra-admin</text>
  </g>
  <line x1="378" y1="293" x2="401" y2="293" class="line" marker-end="url(#arrow)"/>
  <text x="389" y="276" text-anchor="middle" class="small">auth</text>
  <line x1="575" y1="293" x2="598" y2="293" class="auth" stroke-dasharray="5 4" marker-end="url(#arrow-violet)"/>
  <text x="586" y="284" text-anchor="middle" fill="#C9BCFD" font-size="10">OIDC</text>

  <!-- Groupes de services -->
  <rect x="78" y="365" width="302" height="225" rx="12" class="card-soft"/>
  <text x="229" y="390" text-anchor="middle" class="h2">Public — rôle media</text>
  <line x1="232" y1="328" x2="232" y2="363" class="line" marker-end="url(#arrow)"/>

  <g transform="translate(94 408)">
    <rect width="82" height="105" rx="10" class="card"/>
    <rect x="24" y="14" width="34" height="34" rx="9" fill="#A472D6" fill-opacity=".15"/>
    <path fill="#A472D6" d="M41 20c-4 0-13 18-11 22 2 3 20 3 22 0 2-4-7-22-11-22zm0 8c2 0 6 10 5 12-1 1-9 1-10 0-1-2 3-12 5-12z"/>
    <text x="41" y="68" text-anchor="middle" class="h2">Jellyfin</text>
    <text x="41" y="85" text-anchor="middle" class="small">streaming</text>
  </g>
  <g transform="translate(188 408)">
    <rect width="82" height="105" rx="10" class="card"/>
    <rect x="24" y="14" width="34" height="34" rx="9" fill="#4FC3F7" fill-opacity=".15"/>
    <g class="icon" stroke="#4FC3F7">
      <circle cx="39" cy="30" r="8"/>
      <path d="M45 36l7 7m-13-16v7m-4-3h8"/>
    </g>
    <text x="41" y="68" text-anchor="middle" class="h2">Jellyseerr</text>
    <text x="41" y="85" text-anchor="middle" class="small">demandes</text>
  </g>
  <g transform="translate(282 408)">
    <rect width="82" height="105" rx="10" class="card"/>
    <rect x="24" y="14" width="34" height="34" rx="9" fill="#5DD39E" fill-opacity=".15"/>
    <path d="M32 31l6 6 12-13" fill="none" stroke="#5DD39E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="41" y="67" text-anchor="middle" fill="#E9ECF1" font-size="10.5" font-weight="600">access-approve</text>
    <text x="41" y="84" text-anchor="middle" class="small">validation</text>
    <text x="41" y="97" text-anchor="middle" class="small">inscriptions</text>
  </g>
  <rect x="102" y="531" width="254" height="38" rx="9" class="card"/>
  <text x="229" y="546" text-anchor="middle" class="body">accès familial après validation</text>
  <text x="229" y="560" text-anchor="middle" class="small">rôle Keycloak « media »</text>

  <rect x="402" y="365" width="386" height="225" rx="12" class="card-violet"/>
  <text x="595" y="390" text-anchor="middle" class="h2">Administration — rôle infra-admin</text>
  <path d="M488 328v18h107v17" class="auth" marker-end="url(#arrow-violet)"/>
  <rect x="526" y="337" width="139" height="20" rx="5" fill="#171A21" stroke="#A78BFA" stroke-opacity=".55"/>
  <text x="595" y="351" text-anchor="middle" fill="#C9BCFD" font-size="10">protégé via oauth2-proxy</text>

  <g transform="translate(419 407)">
    <rect width="168" height="48" rx="9" class="card"/>
    <rect x="12" y="9" width="30" height="30" rx="8" fill="#E8C87A" fill-opacity=".12"/>
    <g class="icon" stroke="#E8C87A"><path d="M18 24l9-8 9 8m-15-2v11h12V22"/></g>
    <text x="53" y="21" class="h2">Portail</text><text x="53" y="37" class="small">accueil des services</text>
  </g>
  <g transform="translate(603 407)">
    <rect width="168" height="48" rx="9" class="card"/>
    <rect x="12" y="9" width="30" height="30" rx="8" fill="#2496ED" fill-opacity=".14"/>
    <g fill="#2496ED"><rect x="18" y="16" width="6" height="6"/><rect x="26" y="16" width="6" height="6"/><rect x="18" y="24" width="6" height="6"/><rect x="26" y="24" width="6" height="6"/></g>
    <text x="53" y="21" class="h2">Dockge</text><text x="53" y="37" class="small">stacks Docker</text>
  </g>
  <g transform="translate(419 467)">
    <rect width="168" height="48" rx="9" class="card"/>
    <rect x="12" y="9" width="30" height="30" rx="8" fill="#F2922E" fill-opacity=".14"/>
    <g class="icon" stroke="#F2922E"><path d="M18 31c3-13 17-14 20-3M18 31c5 7 14 7 20 0M28 17v10"/></g>
    <text x="53" y="21" class="h2">Grafana</text><text x="53" y="37" class="small">tableaux de bord</text>
  </g>
  <g transform="translate(603 467)">
    <rect width="168" height="48" rx="9" class="card"/>
    <rect x="12" y="9" width="30" height="30" rx="8" fill="#E6522C" fill-opacity=".14"/>
    <path d="M18 32h19M20 28l5-7 4 4 5-9 4 12" fill="none" stroke="#E6522C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="53" y="21" class="h2">Prometheus</text><text x="53" y="37" class="small">métriques</text>
  </g>
  <rect x="419" y="527" width="352" height="43" rx="9" class="card"/>
  <rect x="431" y="534" width="30" height="29" rx="8" fill="#4FC3F7" fill-opacity=".14"/>
  <g class="icon" stroke="#4FC3F7"><rect x="438" y="540" width="16" height="6" rx="1"/><rect x="438" y="550" width="16" height="6" rx="1"/></g>
  <text x="473" y="545" class="h2">Sonarr · Radarr · Prowlarr · qBittorrent</text>
  <text x="473" y="561" class="small">automatisation · indexation · téléchargement</text>

  <!-- GPU hors VM -->
  <g transform="translate(833 369)">
    <rect width="108" height="128" rx="12" class="card-green"/>
    <rect x="16" y="15" width="34" height="34" rx="9" fill="#76B900" fill-opacity=".15"/>
    <g class="icon" stroke="#76B900">
      <rect x="22" y="25" width="42" height="17" rx="2"/>
      <circle cx="36" cy="33.5" r="6"/>
      <path d="M64 28h10m-10 9h10m-52 9h52"/>
    </g>
    <text x="16" y="70" class="h2">GPU NVIDIA</text>
    <text x="16" y="87" class="body">Quadro P1000</text>
    <text x="16" y="105" class="small">passthrough PCI</text>
    <text x="16" y="118" fill="#8DC63F" font-size="10">NVENC</text>
  </g>
  <path d="M833 433h-38v172H135v-92" class="gpu" stroke-dasharray="6 4" marker-end="url(#arrow-green)"/>
  <rect x="604" y="595" width="112" height="20" rx="5" fill="#171A21" stroke="#76B900" stroke-opacity=".55"/>
  <text x="660" y="609" text-anchor="middle" fill="#8DC63F" font-size="10">PCI · NVENC</text>

  <!-- Sauvegardes -->
  <rect x="35" y="657" width="930" height="82" rx="14" fill="#101319" stroke="#39414F"/>
  <rect x="51" y="669" width="124" height="22" rx="6" class="chip"/>
  <text x="66" y="684" class="section">SAUVEGARDES</text>

  <g transform="translate(190 671)">
    <rect width="230" height="54" rx="10" class="card"/>
    <rect x="13" y="10" width="34" height="34" rx="9" fill="#5DD39E" fill-opacity=".12"/>
    <g class="icon" stroke="#5DD39E"><rect x="21" y="17" width="18" height="22" rx="2"/><path d="M25 23h10m-10 6h10m-10 6h7"/></g>
    <text x="59" y="24" class="h2">Archive quotidienne</text>
    <text x="59" y="41" class="small">bases + configurations</text>
  </g>
  <g transform="translate(438 671)">
    <rect width="220" height="54" rx="10" class="card"/>
    <rect x="13" y="10" width="34" height="34" rx="9" fill="#2496ED" fill-opacity=".12"/>
    <g class="icon" stroke="#2496ED"><rect x="20" y="18" width="20" height="15" rx="2"/><circle cx="30" cy="25.5" r="4"/><path d="M25 38h10m-5-5v5"/></g>
    <text x="59" y="24" class="h2">Image de VM hebdomadaire</text>
    <text x="59" y="41" class="small">tirée par l'hyperviseur</text>
  </g>
  <path d="M420 698h18m220 0h30" class="line" marker-end="url(#arrow)"/>
  <g transform="translate(688 671)">
    <rect width="253" height="54" rx="10" class="card"/>
    <rect x="13" y="10" width="34" height="34" rx="9" fill="#E8C87A" fill-opacity=".12"/>
    <g class="icon" stroke="#E8C87A"><rect x="20" y="22" width="20" height="15" rx="2"/><path d="M30 22v-6m-5 5 5-5 5 5"/></g>
    <text x="59" y="24" class="h2">Copie sur un autre disque</text>
    <text x="59" y="41" class="small">stockage secondaire hors VM</text>
  </g>
</svg>
