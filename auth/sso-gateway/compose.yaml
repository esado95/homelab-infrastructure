services:
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3
    container_name: oauth2-proxy
    restart: unless-stopped
    # OAUTH2_PROXY_CLIENT_SECRET + OAUTH2_PROXY_COOKIE_SECRET (voir .env.example)
    env_file: .env
    environment:
      # --- Fournisseur d'identité ---
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      OAUTH2_PROXY_CLIENT_ID: admin-gate
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://auth.example.com/realms/homelab
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"

      # --- Mode « portier » (forward_auth), pas proxy complet ---
      # Le trafic des applis ne passe PAS par oauth2-proxy : Caddy lui demande
      # seulement « cette session est-elle valide ? ». `static://202` fournit donc
      # un upstream factice qui répond 202 — il n'y a aucun vrai backend derrière.
      OAUTH2_PROXY_UPSTREAMS: "static://202"
      # On est derrière Caddy : faire confiance à X-Forwarded-* pour l'IP et l'URL
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      # Renvoie l'identité validée dans X-Auth-Request-User / -Email
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"

      # --- Session partagée par tous les sous-domaines ---
      # Un seul cookie sur `.example.com` => une seule connexion pour tous les services
      OAUTH2_PROXY_COOKIE_DOMAINS: ".example.com"
      # Redirections après login autorisées uniquement vers mes propres sous-domaines
      OAUTH2_PROXY_WHITELIST_DOMAINS: ".example.com"
      OAUTH2_PROXY_COOKIE_SECURE: "true"

      # --- Confort & sécurité ---
      # Pas de page intermédiaire « Sign in with Keycloak » : on va droit au login
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: "S256"
    networks:
      - proxy

networks:
  # Réseau partagé avec Caddy et les services d'administration
  proxy:
    external: true
